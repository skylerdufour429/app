<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="iOS App Collection Archive">
  <title>iOS App Collection Archive</title>
  <link rel="icon" href="assets/icons/app-archive.ico">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand"><img src="assets/icons/app-archive.svg" alt=""> <span>iOS App Collection</span></div>
      <h1>App Collection Archive</h1>
      <p>GitHub Pages + GitHub Codespaces-ready catalog for archived iOS app metadata.</p>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search app, bundle ID, version, or iOS version…" aria-label="Search apps">
        <select id="platform"><option value="">All platforms</option><option value="iOS">iOS</option></select>
      </div>
    </div>
  </header>
  <main class="container">
    <section class="stats" id="stats"></section>
    <section>
      <div class="section-head"><h2>Applications</h2><span id="count"></span></div>
      <div id="app-grid" class="grid" aria-live="polite"></div>
      <p id="empty" class="empty" hidden>No matching applications.</p>
    </section>
  </main>
  <footer>iOS App Collection Archive · Static site · GitHub Pages compatible</footer>
  <script src="src/app.js"></script>
</body>
</html>
